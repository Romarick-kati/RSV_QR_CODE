<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- Google shows a favicon in search results only from a crawlable icon
         whose size is a multiple of 48px — the 192px PNG satisfies that, and
         the SVG above still serves modern browsers. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- SVG favicons aren't used by iOS's "Add to Home Screen" or by most
         link-preview/social-share crawlers — they need a real PNG. These
         two, plus the manifest below, are what were missing before: without
         them, saving this site to a phone's home screen or sharing its link
         in WhatsApp/LinkedIn showed a blank or default icon instead of the
         actual logo. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before the first paint. The app's default for
         new visitors is light, but the stylesheet's base colours are dark, so
         without this the page flashed dark for a moment before React
         switched it. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('presence_theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <link rel="preload" as="image" href="/icon-192.png" />
    <style id="boot-css">
      /* Start screen: shown the instant the HTML arrives, before any
         JavaScript has downloaded, then replaced when the app mounts. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFFFFF; color: #0B0F22; z-index: 9999; font-family: Georgia, 'Times New Roman', serif; }
      html[data-theme="dark"] #boot { background: #0A0D18; color: #FFFFFF; }
      #boot .b-mark { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; }
      #boot .b-mark img { width: 104px; height: 104px; border-radius: 50%; animation: bootPulse 1.8s ease-in-out infinite; }
      #boot .b-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(34,211,166,0.18); border-top-color: #22D3A6; border-right-color: #8B7CF6; animation: bootSpin 1.1s linear infinite; }
      #boot .b-word { font-size: 30px; font-weight: 700; letter-spacing: 0.01em; }
      #boot .b-tag { font: 500 13px system-ui, sans-serif; color: #14B88F; margin-top: -8px; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { #boot .b-ring, #boot .b-mark img { animation: none; } }
    </style>

    <!-- Fonts moved here from a CSS @import (see index.css) — an @import
         can't be discovered by the browser until after it downloads and
         parses the built stylesheet, adding a full extra round-trip before
         any text can render. A <link> in <head> lets the browser discover
         and start fetching these in parallel with everything else, which is
         a meaningful chunk of the "Performance" score on a text-heavy hero
         section like this app's Landing page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" />
